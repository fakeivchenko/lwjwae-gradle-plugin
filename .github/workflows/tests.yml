name: Tests

# Runs on its own for every push to dev, and as a step of the release workflow.
on:
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Gradle client itself loads a native library; without this, every run starts with a warning.
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  # The plugin picks a backend by the operating system of the build, so it runs on all three.
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: Linux
          - runner: windows-2025
            name: Windows
          - runner: macos-15
            name: macOS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Style and tests
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest test

      - name: Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-reports-${{ matrix.name }}
          path: '**/build/reports/checkstyle/'
          if-no-files-found: ignore

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
